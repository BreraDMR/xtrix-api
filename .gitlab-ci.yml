stages:
  - lint
  - test
  - security
  - build
  - deploy

variables:
  PYTHON_VERSION: "3.11"
  POSTGRES_VERSION: "15"
  REDIS_VERSION: "7"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

before_script:
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt

lint:
  stage: lint
  image: python:${PYTHON_VERSION}
  script:
    - pip install flake8 black isort mypy
    - flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
    - flake8 app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - black --check app/ tests/
    - isort --check-only app/ tests/
  only:
    - merge_requests
    - main
    - develop

test:
  stage: test
  image: python:${PYTHON_VERSION}
  services:
    - name: postgres:${POSTGRES_VERSION}
      alias: postgres
    - name: redis:${REDIS_VERSION}
      alias: redis
  variables:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/test_medic
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: test-secret-key-minimum-32-characters-long-for-testing
    ENVIRONMENT: test
  script:
    - pip install pytest pytest-cov pytest-asyncio httpx
    - alembic upgrade head
    - pytest tests/ -v --cov=app --cov-report=xml --cov-report=term
    - coverage report
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  only:
    - merge_requests
    - main
    - develop

security:
  stage: security
  image: python:${PYTHON_VERSION}
  script:
    - pip install bandit safety
    - bandit -r app/ -f json -o bandit-report.json || true
    - safety check --json || true
  artifacts:
    reports:
      sast: bandit-report.json
  only:
    - merge_requests
    - main

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker push $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  only:
    - main
    - develop

deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SSH_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $SSH_USER@$SSH_HOST << 'EOF'
        cd /opt/beauty-crm-api-staging
        docker-compose pull
        docker-compose up -d
        docker-compose exec -T api alembic upgrade head
        docker-compose restart api
      EOF
  environment:
    name: staging
    url: https://staging-api.beautycrm.com
  only:
    - develop

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SSH_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $SSH_USER@$SSH_HOST << 'EOF'
        cd /opt/beauty-crm-api
        docker-compose pull
        docker-compose up -d
        docker-compose exec -T api alembic upgrade head
        docker-compose restart api
      EOF
  environment:
    name: production
    url: https://api.beautycrm.com
  when: manual
  only:
    - main









