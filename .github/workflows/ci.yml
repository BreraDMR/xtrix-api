name: CI

# Damir 13.11.2026: checks run locally (scripts/check.sh on a clean export) before every push,
# so GitHub doesn't run the suite on its own. Start it by hand when you want it.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xtrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: scripts/check.sh
        env:
          PYTHON: python
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xtrix_test
        run: ./scripts/check.sh
