name: xtrix-local
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xtrix_demo
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d xtrix_demo]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env.local-demo
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/xtrix_demo
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      FRONTEND_URL: http://localhost:3000
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/metrics/health/ready]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  web:
    image: nginx:alpine
    ports:
      - 127.0.0.1:3000:80
    volumes:
      - ../web/dist:/usr/share/nginx/html:ro
      - ./scripts/local-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
volumes:
  db_data:
