# Render Blueprint: the API as a free Docker web service. The database lives on Neon (free, permanent) -
# Render's own free Postgres is deleted after 30 days. Scheduled jobs run from GitHub Actions (jobs.yml).
services:
  - type: web
    name: xtrix-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: staging
    healthCheckPath: /metrics/health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TRUST_PROXY
        value: "true"  # client IP for rate limiting = last X-Forwarded-For hop, added by Render's proxy
      - key: DATABASE_URL
        sync: false  # Neon connection string, with ?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false  # web client origin(s), comma-separated
      - key: FRONTEND_URL
        sync: false
      - key: REDIS_URL
        value: redis://localhost:1/0  # one demo worker; plans and limits fall back to memory
      - key: DOCS_USERNAME
        sync: false
      - key: DOCS_PASSWORD
        sync: false
